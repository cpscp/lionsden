<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b08"><title>Lion's Den · Atualização</title></head><body style="margin:0;background:#060b08;color:#f3f7f4;font-family:system-ui;text-align:center;padding:48px 24px"><h1>Lion's Den</h1><p id="status">A atualizar a aplicação…</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('status').textContent='Atualização concluída. A abrir a versão atual…';setTimeout(()=>location.replace('./?v=6'),300)}catch(e){document.getElementById('status').textContent='Abra novamente a Lion\'s Den para concluir a atualização.'}})();</script></body></html>
