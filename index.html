<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<title>Lion's Den · Sporting CP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#060b08;--surface:#0d1510;--surface2:#121d16;--green:#08a56e;--muted:#799087;--line:rgba(255,255,255,.08);--gold:#e7c35b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7f4;font-family:'Space Grotesk',system-ui,sans-serif}button{font:inherit}
.wrap{max-width:540px;margin:auto;min-height:100vh;padding-bottom:94px}.header{position:sticky;top:0;z-index:30;background:rgba(6,11,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}.hero{background:radial-gradient(100% 130% at 15% 0%,#123d29 0%,#0a1710 48%,#0a100c 100%);border-radius:26px;border:1px solid var(--line);overflow:hidden}
.muted{color:var(--muted)}.screen{display:none}.screen.active{display:block}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(18,29,22,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.navbtn{color:var(--muted)}.navbtn.active{color:#fff}.pill{border:1px solid var(--line);border-radius:999px}.logo{width:40px;height:40px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#03130c;font-weight:800}
.row{border-top:1px solid var(--line)}.statbox{background:#09110c;border:1px solid var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none}.modal.open{display:flex}
.modalpanel{max-width:540px;width:100%;margin:auto;max-height:94vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0}.source{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#698477}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><div class="px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3"><div class="logo">S</div><div><div class="text-[20px] font-bold">Lion's Den</div><div class="text-[9px] uppercase tracking-[.22em] muted">Sporting CP</div></div></div>
<span id="updated" class="pill px-3 py-1 text-[9px] uppercase tracking-widest muted">a carregar</span>
</div></header>

<main class="px-4 pt-4 space-y-5">
<section id="home" class="screen active space-y-5">
<div class="hero p-4"><div class="flex items-center justify-between"><span class="text-[10px] uppercase tracking-[.18em] muted">Próximo jogo</span><span id="homeComp" class="pill px-2 py-1 text-[9px] muted">—</span></div><div id="nextGame" class="mt-5"></div></div>
<div><div class="flex items-end justify-between mb-3"><h2 class="text-[18px] font-bold">Classificação</h2><span class="text-[10px] uppercase tracking-widest muted">Primeira Liga</span></div><div class="card p-3" id="standings"></div></div>
<div><div class="flex items-end justify-between mb-3"><h2 class="text-[18px] font-bold">Forma</h2><button class="text-[10px] uppercase tracking-widest muted" onclick="go('stats')">Ver stats →</button></div><div class="grid grid-cols-6 gap-2" id="form"></div></div>
<div class="card p-4"><div class="flex items-center justify-between mb-3"><h2 class="font-bold">Últimas notícias</h2><button class="text-[10px] uppercase tracking-widest muted" onclick="go('news')">Ver todas →</button></div><div id="homeNews" class="space-y-3"></div></div>
</section>

<section id="games" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Jogos</h2><p class="text-[11px] muted">Calendário, estádio, árbitro e mapa</p></div><div id="gamesList" class="space-y-3"></div></section>
<section id="squad" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Plantel</h2><p class="text-[11px] muted">Época 2026/27 · todas as competições</p></div><div id="squadList" class="space-y-2"></div></section>
<section id="stats" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Estatísticas</h2><p class="text-[11px] muted">Sporting CP · 2026/27</p></div><div id="teamStats"></div></section>
<section id="news" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Notícias</h2><p class="text-[11px] muted">Sporting.pt + agregação de notícias</p></div><div id="newsList" class="space-y-2"></div></section>
</main></div>

<nav class="bottom"><div class="max-w-[540px] mx-auto grid grid-cols-5">
<button class="navbtn active py-3 text-[10px]" data-go="home">⌂<br>Início</button>
<button class="navbtn py-3 text-[10px]" data-go="games">◷<br>Jogos</button>
<button class="navbtn py-3 text-[10px]" data-go="squad">♟<br>Plantel</button>
<button class="navbtn py-3 text-[10px]" data-go="stats">▥<br>Stats</button>
<button class="navbtn py-3 text-[10px]" data-go="news">▤<br>Notícias</button>
</div></nav>

<div id="modal" class="modal"><div class="modalpanel">
<div class="sticky top-0 z-10 p-4 flex justify-between items-center bg-[var(--bg)] border-b border-white/5"><b id="modalTitle">Detalhes</b><button onclick="closeModal()" class="pill w-9 h-9">×</button></div>
<div id="modalBody" class="p-4"></div></div></div>

<script>
const files=['fixtures.json','standings.json','squad.json','team-stats.json','news.json','venues.json','match-details.json','fbref-schedule.json','status.json'];const D={};
async function load(){
  const loadOne=async f=>{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),5000);
    try{
      const r=await fetch('./data/'+f+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});
      if(r.ok) D[f]=await r.json();
    }catch(e){ console.warn("Lion's Den data:",f,e?.message||e); }
    finally{ clearTimeout(timer); }
  };
  await Promise.allSettled(files.map(loadOne));
  try{ render(); }catch(e){
    console.error("Lion's Den render error",e);
    document.getElementById('updated').textContent='erro de dados';
    document.getElementById('nextGame').innerHTML='<div class="text-center py-8 text-red-300">Erro ao carregar os dados. A app continua disponível.</div>';
  }
}
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=x=>{if(!x)return '—';let d=typeof x==='number'?new Date(x*1000):new Date(x);return new Intl.DateTimeFormat('pt-PT',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(d).replace(',',' ·')};
const fmtDay=x=>new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'short'}).format(new Date(x));
function timeAgo(d){const m=Math.floor((Date.now()-new Date(d))/60000);return m<1?'agora':m<60?`há ${m} min`:`há ${Math.floor(m/60)} h`}
function isFuture(f){return !!f.date && Number(f.date)>Math.floor(Date.now()/1000) && !['finished','postponed','cancelled','canceled'].includes(String(f.status?.short||'').toLowerCase())}
function parseMaybeObject(v){
  if(v && typeof v==='object') return v;
  if(typeof v!=='string') return {};
  const t=v.trim();
  if(!t.startsWith('{') || !t.endsWith('}')) return {};
  try{return JSON.parse(t.replace(/'/g,'"'));}catch(e){
    const out={}; t.slice(1,-1).split(/,\s*/).forEach(part=>{const i=part.indexOf(':');if(i>0)out[part.slice(0,i).trim().replace(/^['"]|['"]$/g,'')]=part.slice(i+1).trim().replace(/^['"]|['"]$/g,'');}); return out;
  }
}
function allFixtures(){
  const raw=D['fixtures.json']?.fixtures||D['fixtures.json']?.matches||[];
  return raw.map((x,i)=>{
    const date=Number(x.date||0);
    const home=x.home||x.homeTeam||{}, away=x.away||x.awayTeam||{};
    const venue={...(parseMaybeObject(x.venue)||{})};
    if(!venue.name && typeof x.venue==='string') venue.name=x.venue;
    const status=x.status||{};
    const short=String(status.short||'').toLowerCase();
    const finished=['finished','ft','aet','afterpenalties','afterextra'].includes(short);
    return {
      id:x.id||x.match_id||('fixture-'+i),
      date,
      kickoff_date:x.kickoff_date||null,
      kickoff_local_time:x.kickoff_local_time||null,
      status:{short:short||(finished?'finished':'scheduled'),long:status.long||(finished?'Terminado':'Agendado')},
      referee:typeof x.referee==='string'?x.referee:'',
      venue,
      competition:x.competition||{name:''},
      home:{id:home.id,name:home.name||''},
      away:{id:away.id,name:away.name||''},
      goals:x.goals||{home:null,away:null},
      half_time:x.half_time||{home:null,away:null},
      source:x.source||'FotMob'
    };
  }).filter(x=>x.date>0 && x.home.name && x.away.name).sort((a,b)=>a.date-b.date);
}
function nextFixture(){return allFixtures().filter(isFuture)[0]}
function initials(n){return (n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function badge(n){return `<div class="w-11 h-11 rounded-full bg-white/10 grid place-items-center text-[11px] font-bold">${esc(initials(n))}</div>`}
function metric(k,v){return `<div class="statbox p-4"><div class="text-[10px] uppercase tracking-widest muted">${k}</div><div class="text-[23px] font-bold mt-1">${v??'—'}</div></div>`}
function render(){
const u=D['fixtures.json']?new Date(D['fixtures.json']._updated_at):null;document.getElementById('updated').textContent=u?`dados ${timeAgo(u)}`:'sem dados';
renderHome();renderGames();renderSquad();renderStats();renderNews();
}
function countdownHtml(ts){return '<div id="nextCountdown" class="mt-4 text-center"><div class="text-[9px] uppercase tracking-[.2em] muted">Contagem decrescente</div><div class="text-xl font-bold mt-1">a calcular…</div></div>';}
function updateCountdown(ts){const el=document.getElementById('nextCountdown');if(!el)return;const tick=()=>{const diff=Math.max(0,Number(ts)*1000-Date.now());const total=Math.floor(diff/1000);const d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),sec=total%60;el.querySelector('div:last-child').textContent=diff?'em '+d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(sec).padStart(2,'0')+'s':'A começar agora';};tick();clearInterval(window._nextCountdown);window._nextCountdown=setInterval(tick,1000);}
function renderHome(){
const f=nextFixture();document.getElementById('homeComp').textContent=f?.competition?.name||'—';
document.getElementById('nextGame').innerHTML=f?`<div class="flex items-center justify-between gap-2">
<div class="w-[34%] text-center">${badge(f.home?.name)}<div class="text-[12px] font-semibold mt-2">${esc(f.home?.name)}</div></div>
<div class="text-center flex-1"><div class="text-[10px] muted">${fmtDate(f.date)}</div><div class="text-[25px] font-bold my-2">VS</div><div class="text-[10px] muted">${esc(f.competition?.round||f.kickoff_local_time||'')}</div></div>
<div class="w-[34%] text-center">${badge(f.away?.name)}<div class="text-[12px] font-semibold mt-2">${esc(f.away?.name)}</div></div></div>
<div class="mt-5 pt-3 row flex items-center justify-between text-[10px] muted gap-3"><span>🏟 ${esc(f.venue?.name||'Estádio por confirmar')}</span><span>${esc(f.referee||'Árbitro por confirmar')}</span></div>
${countdownHtml(f.date)}
<button onclick="openGame('${esc(f.id)}')" class="mt-3 w-full pill py-2.5 text-[11px] font-semibold">Ver detalhes do jogo →</button>`:
'<div class="text-center py-8 muted">Sem próximo jogo disponível.</div>';
if(f) updateCountdown(f.date);

const rows=D['standings.json']?.table||D['standings.json']?.standings||[];
document.getElementById('standings').innerHTML=rows.slice(0,8).map(r=>{const team=typeof r.team==='object'?(r.team.shortName||r.team.name||'—'):(r.team||r.teamName||'—');const pos=r.position??r.rank??'—';const played=r.playedGames??r.played??'—';return `<div class="grid grid-cols-[28px_1fr_42px_42px] items-center py-2 border-b border-white/5 last:border-0 text-[12px]"><span class="muted">${pos}</span><span>${esc(team)}</span><span class="text-right">${played}</span><b class="text-right">${r.points??'—'}</b></div>`}).join('')||'<div class="py-6 text-center muted">Sem classificação.</div>';
const form=D['team-stats.json']?.team?.form||[];document.getElementById('form').innerHTML=form.map(x=>`<div class="statbox text-center py-3 font-bold ${x==='W'?'text-emerald-400':x==='L'?'text-red-400':'text-amber-300'}">${x==='W'?'V':x==='L'?'D':'E'}</div>`).join('')||'<div class="col-span-6 text-center muted">—</div>';
const ns=(D['news.json']?.items||[]).slice(0,4);document.getElementById('homeNews').innerHTML=ns.map(newsCard).join('')||'<span class="muted text-sm">Sem notícias.</span>';
}
function renderGames(){
const merged=allFixtures();const up=merged.filter(isFuture),past=merged.filter(x=>!isFuture(x)).sort((a,b)=>(b.date||0)-(a.date||0));const out=[...up,...past];
document.getElementById('gamesList').innerHTML=out.slice(0,28).map(x=>`<button onclick="openGame('${esc(x.id)}')" class="card w-full p-4 text-left"><div class="flex items-center justify-between mb-3"><span class="source">${esc(x.competition?.name||'')}</span><span class="text-[9px] muted">${fmtDate(x.date)}</span></div><div class="flex items-center gap-3"><div class="flex-1 flex items-center justify-end gap-2 text-[12px] font-semibold text-right">${esc(x.home?.name)} ${badge(x.home?.name)}</div><div class="font-bold min-w-[54px] text-center">${x.goals?.home!=null?`${x.goals.home} - ${x.goals.away}`:'VS'}</div><div class="flex-1 flex items-center gap-2 text-[12px] font-semibold">${badge(x.away?.name)} ${esc(x.away?.name)}</div></div><div class="mt-3 text-[10px] muted flex justify-between"><span>🏟 ${esc(x.venue?.name||'ver detalhes')}</span><span>${esc(x.status?.long||'')}</span></div></button>`).join('')||'<div class="card p-6 text-center muted">Sem jogos.</div>';
}
function renderSquad(){
const raw=D['squad.json']||{}; const ps=raw.players||raw.squad||[];document.getElementById('squadList').innerHTML=ps.map((p,i)=>`<button onclick="openPlayer(${i})" class="card w-full p-3 flex items-center gap-3 text-left"><div class="w-12 h-12 rounded-full bg-white/5 overflow-hidden">${p.photo?`<img src="${esc(p.photo)}" class="w-full h-full object-cover" alt="">`:badge(p.name)}</div><div class="flex-1"><div class="font-semibold text-[13px]">${esc(p.name)}</div><div class="text-[10px] muted">${esc(p.position||'—')} · ${esc(p.nation||p.nationality||'—')}</div></div><div class="text-right"><b class="text-[13px]">${p.stats?.goals??p.goals??0}</b><div class="text-[9px] muted">golos</div></div></button>`).join('')||'<div class="card p-6 text-center muted">Sem plantel.</div>';
}
function renderStats(){
const t=D['team-stats.json']?.team||{},f=allFixtures(),now=Math.floor(Date.now()/1000),played=f.filter(x=>x.date&&Number(x.date)<=now&&String(x.status?.short||'').toLowerCase()!=='postponed');
let gf=0,ga=0,w=0,d=0,l=0,cs=0;
for(const x of played){
  const gh=Number(x.goals?.home),ga0=Number(x.goals?.away);
  if(!Number.isFinite(gh)||!Number.isFinite(ga0))continue;
  const home=String(x.home?.name||'').toLowerCase().includes('sporting'),sg=home?gh:ga0,og=home?ga0:gh;
  gf+=sg;ga+=og;if(sg>og)w++;else if(sg===og)d++;else l++;if(og===0)cs++;
}
const ps=D['squad.json']?.players||D['squad.json']?.squad||[],num=k=>ps.reduce((n,p)=>n+Number((p.stats?.[k]??p[k])||0),0);
const v={matches:t.matches??w+d+l,wins:t.wins??w,draws:t.draws??d,losses:t.losses??l,goals:t.goals??gf,goals_against:t.goals_against??ga,assists:t.assists??num('assists'),clean_sheets:t.clean_sheets??cs};
const el=document.getElementById('teamStats');if(!el)return;
el.innerHTML='<div class="grid grid-cols-2 gap-2">'+metric('Jogos',v.matches)+metric('Vitórias',v.wins)+metric('Empates',v.draws)+metric('Derrotas',v.losses)+metric('Golos',v.goals)+metric('Golos sofridos',v.goals_against)+metric('Assistências',v.assists)+metric('Clean sheets',v.clean_sheets)+'</div><div class="card p-4 mt-3"><div class="font-semibold">2026/27 · todas as competições</div><div class="text-[11px] muted mt-2">Dados calculados a partir dos jogos e do plantel disponíveis.</div></div>';
}
function newsCard(n){return `<a href="${esc(n.url)}" target="_blank" rel="noopener" class="block card p-3"><div class="source">${esc(n.source||'Notícia')}</div><div class="font-semibold text-[12px] mt-1 leading-snug">${esc(n.title)}</div><div class="text-[9px] muted mt-2">${esc(n.published||'Abrir artigo')} ↗</div></a>`}
function renderNews(){document.getElementById('newsList').innerHTML=(D['news.json']?.items||[]).map(newsCard).join('')||'<div class="card p-6 text-center muted">Sem notícias.</div>'}
function openPlayer(i){
const p=((D['squad.json']?.players||D['squad.json']?.squad||[]))[i];if(!p)return;document.getElementById('modalTitle').textContent=p.name;
document.getElementById('modalBody').innerHTML=`<div class="flex items-center gap-4 mb-5">${p.photo?`<img src="${esc(p.photo)}" class="w-20 h-20 rounded-full object-cover">`:badge(p.name)}<div><div class="text-xl font-bold">${esc(p.name)}</div><div class="muted text-sm">${esc(p.position||'—')} · ${esc(p.nation||p.nationality||'—')}</div><div class="muted text-xs mt-1">${esc(p.age||'—')} anos</div>${p.profile?`<a class="text-[10px] text-emerald-400" target="_blank" href="${esc(p.profile)}">Perfil FBref ↗</a>`:''}</div></div><div class="grid grid-cols-2 gap-2">${metric('Jogos',p.stats?.matches??p.matches)}${metric('Titular',p.stats?.starts??p.starts)}${metric('Minutos',p.stats?.minutes??p.minutes)}${metric('Golos',p.stats?.goals??p.goals)}${metric('Assistências',p.stats?.assists??p.assists)}${metric('Amarelos',p.stats?.yellow??p.yellow)}${metric('Vermelhos',p.stats?.red??p.red)}${p.position==='GK'?metric('Defesas',p.stats?.saves??p.saves)+metric('Clean sheets',p.stats?.clean_sheets??p.clean_sheets):''}</div><div class="card p-4 mt-4"><div class="font-semibold">Época 2026/27</div><p class="text-[11px] muted mt-2">Estatísticas agregadas das competições cobertas pelos dados disponíveis. Remates e remates enquadrados foram removidos enquanto não houver dados fiáveis.</p></div>`;
openModal();
}
function findFixture(id){return allFixtures().find(x=>String(x.id)===String(id))}
function openGame(id){
const base=findFixture(id);const detail=(D['match-details.json']?.fixtures||[]).find(x=>String(x.match_id)===String(id));if(!base){return}
let v=base.venue||{};const cached=(D['venues.json']?.venues)||{};if((v.lat==null||v.lon==null)&&base.home?.name&&base.away?.name){const opponent=base.home.name==='Sporting CP'?base.away.name:base.home.name;const hit=Object.entries(cached).find(([k])=>k.toLowerCase().includes(opponent.toLowerCase()));if(hit){v={...v,...hit[1]};}}let lat=v.lat,lon=v.lon;let map=lat!=null&&lon!=null?`<iframe class="w-full h-56 rounded-2xl border-0" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.015}%2C${lat-.01}%2C${lon+.015}%2C${lat+.01}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>`:`<a class="pill inline-block px-3 py-2 text-xs" target="_blank" href="https://www.openstreetmap.org/search?query=${encodeURIComponent((v.name||'')+' '+(v.city||''))}">Abrir mapa ↗</a>`;
document.getElementById('modalTitle').textContent=`${base.home?.name||''} · ${base.away?.name||''}`;
document.getElementById('modalBody').innerHTML=`<div class="text-center mb-5"><div class="muted text-xs">${fmtDate(base.date)} · ${esc(base.competition?.name||'')}</div><div class="flex items-center justify-center gap-4 mt-4"><div class="w-[38%] text-center">${badge(base.home?.name)}<div class="font-semibold text-sm mt-2">${esc(base.home?.name)}</div></div><div class="font-bold text-xl">${base.goals?.home!=null?`${base.goals.home}-${base.goals.away}`:'VS'}</div><div class="w-[38%] text-center">${badge(base.away?.name)}<div class="font-semibold text-sm mt-2">${esc(base.away?.name)}</div></div></div></div><div class="card p-4 space-y-2"><div class="font-semibold mb-1">Informação do jogo</div><div class="text-xs muted">🏟 ${esc(v.name||'Por confirmar')} ${v.city?'· '+esc(v.city):''}</div><div class="text-xs muted">👨‍⚖️ ${esc(base.referee||detail?.referee_name||'Árbitro por confirmar')}</div><div class="text-xs muted">🏆 ${esc(base.competition?.round||base.competition?.name||'')}</div>${v.capacity?`<div class="text-xs muted">👥 Capacidade: ${esc(v.capacity)}</div>`:''}</div><div class="card p-3 mt-3">${map}</div>${detail?`<div class="card p-4 mt-3"><div class="font-semibold">Fonte do detalhe</div><div class="text-[10px] muted mt-2">Dados do jogo atualizados pelo Football Soccer API.</div></div>`:''}<div class="text-[10px] muted mt-3">Futebol: FotMob · mapa: OpenStreetMap</div>`;
openModal();
}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.go));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};load();setInterval(load,300000);
</script>
</body></html>
