<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b"><title>Lion's Den</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#060b08;--surface:#0d1510;--surface2:#121d16;--green:#08a56e;--green2:#087b54;--text:#f3f7f4;--muted:#799087;--line:rgba(255,255,255,.08);--gold:#e7c35b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}button{font:inherit}.wrap{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.header{position:sticky;top:0;z-index:30;background:rgba(6,11,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}.hero{background:radial-gradient(100% 130% at 15% 0%,#123d29 0%,#0a1710 48%,#0a100c 100%);border-radius:26px;border:1px solid var(--line);overflow:hidden}.muted{color:var(--muted)}.screen{display:none}.screen.active{display:block}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(18,29,22,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.navbtn{color:var(--muted)}.navbtn.active{color:var(--text)}.pill{border:1px solid var(--line);border-radius:999px}.logo{width:40px;height:40px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#03130c;font-weight:800}.teamlogo{width:42px;height:42px;object-fit:contain}.row{border-top:1px solid var(--line)}.statbox{background:#09110c;border:1px solid var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none}.modal.open{display:flex}.modalpanel{max-width:520px;width:100%;margin:auto;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0}.bar{height:6px;border-radius:99px;background:#17251c;overflow:hidden}.bar>i{display:block;height:100%;background:var(--green)}a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><div class="px-4 py-3 flex items-center justify-between"><div class="flex items-center gap-3"><div class="logo">S</div><div><div class="text-[20px] font-bold">Lion's Den</div><div class="text-[9px] uppercase tracking-[.22em] muted">Sporting CP</div></div></div><span id="updated" class="pill px-3 py-1 text-[9px] uppercase tracking-widest muted">a carregar</span></div></header>
<main class="px-4 pt-4 space-y-5">
<section id="home" class="screen active space-y-5">
<div class="hero p-4"><div class="flex items-center justify-between"><span class="text-[10px] uppercase tracking-[.18em] muted">Próximo jogo</span><span id="homeComp" class="pill px-2 py-1 text-[9px] muted">—</span></div><div id="nextGame" class="mt-5"></div></div>
<div><div class="flex items-end justify-between mb-3"><h2 class="text-[18px] font-bold">Classificação</h2><span class="text-[10px] uppercase tracking-widest muted">Liga Portugal</span></div><div class="card p-3 overflow-hidden"><div id="standings"></div></div></div>
<div><div class="flex items-end justify-between mb-3"><h2 class="text-[18px] font-bold">Forma</h2><button class="text-[10px] uppercase tracking-widest muted" onclick="go('stats')">Ver estatísticas →</button></div><div class="grid grid-cols-4 gap-2" id="form"></div></div>
<div class="card p-4"><div class="flex items-center justify-between mb-3"><h2 class="font-bold">Últimas notícias</h2><button class="text-[10px] uppercase tracking-widest muted" onclick="go('news')">Ver todas →</button></div><div id="homeNews" class="space-y-3"></div></div>
</section>
<section id="games" class="screen space-y-4"><div class="flex items-end justify-between"><div><h2 class="text-[21px] font-bold">Jogos</h2><p class="text-[11px] muted">Próximos e últimos resultados</p></div></div><div id="gamesList" class="space-y-3"></div></section>
<section id="squad" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Plantel</h2><p class="text-[11px] muted">Época 2026/27</p></div><div id="squadList" class="space-y-2"></div></section>
<section id="stats" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Estatísticas</h2><p class="text-[11px] muted">Sporting CP · 2026/27</p></div><div id="teamStats"></div></section>
<section id="news" class="screen space-y-4"><div><h2 class="text-[21px] font-bold">Notícias</h2><p class="text-[11px] muted">Atualizadas automaticamente</p></div><div id="newsList" class="space-y-2"></div></section>
</main>
</div>
<nav class="bottom"><div class="max-w-[520px] mx-auto grid grid-cols-5"><button class="navbtn active py-3 text-[10px]" data-go="home">⌂<br>Início</button><button class="navbtn py-3 text-[10px]" data-go="games">◷<br>Jogos</button><button class="navbtn py-3 text-[10px]" data-go="squad">♟<br>Plantel</button><button class="navbtn py-3 text-[10px]" data-go="stats">▥<br>Stats</button><button class="navbtn py-3 text-[10px]" data-go="news">▤<br>Notícias</button></div></nav>
<div id="modal" class="modal"><div class="modalpanel"><div class="sticky top-0 z-10 p-4 flex justify-between items-center bg-[var(--bg)] border-b border-white/5"><b id="modalTitle">Jogo</b><button onclick="closeModal()" class="pill w-9 h-9">×</button></div><div id="modalBody" class="p-4"></div></div></div>
<script>
const files=['fixtures.json','standings.json','squad.json','team-stats.json','news.json','venues.json','match-details.json','live.json'];
const D={};
async function load(){await Promise.all(files.map(async f=>{try{const r=await fetch('./data/'+f+'?t='+Date.now());if(r.ok)D[f]=await r.json()}catch{}}));render();}
function fmtDate(x){if(!x)return '—';return new Intl.DateTimeFormat('pt-PT',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(x)).replace(',',' ·')}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function navName(id){return id===228?'Sporting CP':id}
function isFuture(f){return ['NS','TBD','PST'].includes(f.status?.short)}
function nextFixture(){return (D['fixtures.json']?.fixtures||[]).filter(isFuture).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0))[0]}
function logo(team){return team?.logo?`<img class="teamlogo" src="${esc(team.logo)}" alt="">`:`<div class="teamlogo rounded-full bg-white/10"></div>`}
function render(){
const updated=D['fixtures.json']?new Date(D['fixtures.json']._updated_at):null;document.getElementById('updated').textContent=updated?`dados ${timeAgo(updated)}`:'sem dados';
renderHome();renderGames();renderSquad();renderStats();renderNews();
}
function timeAgo(d){const m=Math.floor((Date.now()-d)/60000);return m<1?'agora':m<60?`há ${m} min`:`há ${Math.floor(m/60)} h`}
function renderHome(){const f=nextFixture();document.getElementById('homeComp').textContent=f?.competition?.name||'—';const el=document.getElementById('nextGame');if(!f){el.innerHTML='<div class="text-center py-8 muted">Sem próximo jogo disponível.</div>';return}el.innerHTML=`<div class="flex items-center justify-between gap-2"><div class="w-[34%] text-center">${logo(f.home)}<div class="text-[12px] font-semibold mt-2">${esc(f.home.name)}</div></div><div class="text-center flex-1"><div class="text-[10px] muted">${fmtDate(f.date)}</div><div class="text-[25px] font-bold my-2">VS</div><div class="text-[10px] muted">${esc(f.competition?.round||'')}</div></div><div class="w-[34%] text-center">${logo(f.away)}<div class="text-[12px] font-semibold mt-2">${esc(f.away.name)}</div></div></div><div class="mt-5 pt-3 row flex items-center justify-between text-[10px] muted"><span>🏟 ${esc(f.venue?.name||'Estádio por confirmar')}</span><span>${esc(f.referee||'Árbitro por confirmar')}</span></div><button onclick="openGame(${f.id})" class="mt-3 w-full pill py-2.5 text-[11px] font-semibold">Ver detalhes do jogo →</button>`}
function renderStandings(){const rows=D['standings.json']?.table||[];return rows.slice(0,8).map(r=>`<div class="grid grid-cols-[28px_1fr_36px_36px] items-center py-2 text-[12px] border-b border-white/5 last:border-0"><span class="muted">${r.rank}</span><div class="flex items-center gap-2"><img src="${esc(r.team?.logo||'')}" class="w-5 h-5 object-contain"><span>${esc(r.team?.name)}</span></div><span>${r.all?.played??'—'}</span><b>${r.points??'—'}</b></div>`).join('')||'<div class="py-6 text-center muted text-sm">Sem dados de classificação.</div>'}
function renderForm(){const arr=(D['team-stats.json']?.team?.form||'').split('').slice(-6);return arr.map(x=>`<div class="statbox text-center py-3 font-bold ${x==='W'?'text-emerald-400':x==='L'?'text-red-400':'text-amber-300'}">${x==='W'?'V':x==='L'?'D':'E'}</div>`).join('')||'<div class="col-span-4 text-center muted">Sem forma disponível.</div>'}
function renderHome(){document.getElementById('standings').innerHTML=renderStandings();document.getElementById('form').innerHTML=renderForm();const n=(D['news.json']?.items||[]).slice(0,4);document.getElementById('homeNews').innerHTML=n.map(newsCard).join('')||'<span class="muted text-sm">Sem notícias.</span>'}
function renderGames(){const fs=(D['fixtures.json']?.fixtures||[]).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));const upcoming=fs.filter(isFuture);const past=fs.filter(f=>!isFuture(f)).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));const out=[...upcoming,...past];document.getElementById('gamesList').innerHTML=out.map(f=>`<button onclick="openGame(${f.id})" class="card w-full p-4 text-left"><div class="flex items-center justify-between mb-3"><span class="text-[9px] uppercase tracking-widest muted">${esc(f.competition?.name||'')}</span><span class="text-[9px] muted">${fmtDate(f.date)}</span></div><div class="flex items-center gap-3"><div class="flex-1 flex items-center justify-end gap-2 text-[12px] font-semibold text-right">${esc(f.home.name)} ${logo(f.home)}</div><div class="font-bold min-w-[54px] text-center">${f.goals?.home!=null?`${f.goals.home} - ${f.goals.away}`:'VS'}</div><div class="flex-1 flex items-center gap-2 text-[12px] font-semibold">${logo(f.away)} ${esc(f.away.name)}</div></div><div class="mt-3 text-[10px] muted flex justify-between"><span>🏟 ${esc(f.venue?.name||'—')}</span><span>${esc(f.status?.long||'')}</span></div></button>`).join('')||'<div class="card p-6 text-center muted">Sem jogos.</div>'}
function playerStats(p){const s=p.stats||[];let apps=0,g=0,a=0,min=0,y=0,r=0,rating=[];for(const x of s){apps+=x.games?.appearences||0;g+=x.goals?.total||0;a+=x.goals?.assists||0;min+=x.games?.minutes||0;y+=x.cards?.yellow||0;r+=x.cards?.red||0;if(x.games?.rating)rating.push(parseFloat(x.games.rating))}return {apps,g,a,min,y,r,rating:rating.length?(rating.reduce((x,y)=>x+y,0)/rating.length).toFixed(2):'—'}}
function renderSquad(){const ps=D['squad.json']?.players||[];document.getElementById('squadList').innerHTML=ps.map(p=>{const s=playerStats(p);return `<button onclick="openPlayer(${p.id})" class="card w-full p-3 flex items-center gap-3 text-left"><img src="${esc(p.photo||'')}" class="w-12 h-12 rounded-full object-cover bg-white/5"><div class="flex-1"><div class="font-semibold text-[13px]">${esc(p.name)}</div><div class="text-[10px] muted">${esc(p.position||'—')} · ${esc(p.nationality||'—')}</div></div><div class="text-right"><b class="text-[13px]">${s.g}</b><div class="text-[9px] muted">golos</div></div></button>`}).join('')||'<div class="card p-6 text-center muted">Sem plantel.</div>'}
function renderStats(){const t=D['team-stats.json']?.team||{};const f=t.fixtures||{},g=t.goals||{},clean=t.clean_sheet||{};document.getElementById('teamStats').innerHTML=`<div class="grid grid-cols-2 gap-2">${metric('Jogos',f.played?.total)}${metric('Vitórias',f.wins?.total)}${metric('Empates',f.draws?.total)}${metric('Derrotas',f.loses?.total)}${metric('Golos marcados',g.for?.total)}${metric('Golos sofridos',g.against?.total)}${metric('Clean sheets',clean.total)}${metric('Não marcou',t.failed_to_score?.total)}</div><div class="card p-4 mt-3"><div class="font-semibold mb-3">Forma recente</div><div class="text-[28px] font-bold tracking-[.3em]">${esc(t.form||'—')}</div></div>`}
function metric(k,v){return `<div class="statbox p-4"><div class="text-[10px] uppercase tracking-widest muted">${k}</div><div class="text-[24px] font-bold mt-1">${v??'—'}</div></div>`}
function newsCard(n){return `<a href="${esc(n.url)}" target="_blank" rel="noopener" class="block card p-3"><div class="text-[9px] uppercase tracking-widest muted">${esc(n.source||'Notícia')}</div><div class="font-semibold text-[12px] mt-1 leading-snug">${esc(n.title)}</div><div class="text-[9px] muted mt-2">Abrir artigo ↗</div></a>`}
function renderNews(){document.getElementById('newsList').innerHTML=(D['news.json']?.items||[]).map(newsCard).join('')||'<div class="card p-6 text-center muted">Sem notícias.</div>'}
function openPlayer(id){const p=(D['squad.json']?.players||[]).find(x=>x.id===id);if(!p)return;const s=playerStats(p);document.getElementById('modalTitle').textContent=p.name;document.getElementById('modalBody').innerHTML=`<div class="flex items-center gap-4 mb-5"><img src="${esc(p.photo||'')}" class="w-20 h-20 rounded-full object-cover bg-white/5"><div><div class="text-xl font-bold">${esc(p.name)}</div><div class="muted text-sm">${esc(p.position||'—')} · ${esc(p.nationality||'—')}</div><div class="muted text-xs mt-1">${p.height||'—'} · ${p.weight||'—'} · ${p.age||'—'} anos</div></div></div><div class="grid grid-cols-3 gap-2">${metric('Jogos',s.apps)}${metric('Minutos',s.min)}${metric('Golos',s.g)}${metric('Assist.',s.a)}${metric('Amarelos',s.y)}${metric('Vermelhos',s.r)}${metric('Rating',s.rating)}</div><div class="card p-4 mt-4"><div class="font-semibold mb-3">Competições</div>${(p.stats||[]).map(x=>`<div class="row py-2 flex justify-between text-[11px]"><span>${esc(x.league?.name||'')}</span><span>${x.games?.appearences||0} jogos · ${x.goals?.total||0} golos</span></div>`).join('')||'<span class="muted">Sem estatísticas.</span>'}</div>`;openModal()}
function openGame(id){const base=(D['fixtures.json']?.fixtures||[]).find(x=>x.id===id);const detail=(D['match-details.json']?.fixtures||[]).find(x=>x.fixture?.id===id);const live=(D['live.json']?.fixtures||[]).find(x=>x.fixture?.id===id);const d=detail||live;if(!base)return;document.getElementById('modalTitle').textContent=`${base.home.name} · ${base.away.name}`;let venue=D['venues.json']?.venues?.[`${base.venue?.name}|${base.venue?.city||''}`]||{};let map=venue.lat?`<iframe class="w-full h-56 rounded-2xl border-0" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${venue.lon-.015}%2C${venue.lat-.01}%2C${venue.lon+.015}%2C${venue.lat+.01}&layer=mapnik&marker=${venue.lat}%2C${venue.lon}"></iframe>`:`<a class="pill inline-block px-3 py-2 text-xs" target="_blank" href="https://www.openstreetmap.org/search?query=${encodeURIComponent((base.venue?.name||'')+' '+(base.venue?.city||''))}">Abrir mapa ↗</a>`;let events=(d?.events||[]).map(e=>`<div class="row py-2 text-[11px] flex gap-3"><b>${e.time?.elapsed||''}'</b><span>${e.type==='Goal'?'⚽':e.type==='Card'?'🟨':'↔️'}</span><span>${esc(e.player?.name||'')} ${e.assist?.name?`(${esc(e.assist.name)})`:''}</span></div>`).join('');document.getElementById('modalBody').innerHTML=`<div class="text-center mb-5"><div class="muted text-xs">${fmtDate(base.date)} · ${esc(base.competition?.name||'')}</div><div class="flex items-center justify-center gap-4 mt-4"><div class="w-[38%] text-center">${logo(base.home)}<div class="font-semibold text-sm mt-2">${esc(base.home.name)}</div></div><div class="font-bold text-xl">${base.goals?.home!=null?`${base.goals.home}-${base.goals.away}`:'VS'}</div><div class="w-[38%] text-center">${logo(base.away)}<div class="font-semibold text-sm mt-2">${esc(base.away.name)}</div></div></div></div><div class="card p-4 space-y-2"><div class="font-semibold">Jogo</div><div class="text-xs muted">🏟 ${esc(base.venue?.name||'Por confirmar')} · ${esc(base.venue?.city||'')}</div><div class="text-xs muted">👨‍⚖️ ${esc(base.referee||'Por confirmar')}</div><div class="text-xs muted">🏆 ${esc(base.competition?.round||'')}</div></div><div class="card p-3 mt-3">${map}</div>${events?`<div class="card p-4 mt-3"><div class="font-semibold mb-2">Eventos</div>${events}</div>`:''}<div class="text-[10px] muted mt-3">Dados de futebol: API-Football · mapa: OpenStreetMap</div>`;openModal()}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.go));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
load();setInterval(load,180000);
</script>
</body></html>
