name: Atualizar jogos em direto

concurrency:
  group: lions-den-live
  cancel-in-progress: false

on:
  # 10 em 10 minutos, deslocado do início da hora para reduzir atrasos do scheduler.
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Atualizar jogos em direto
        env:
          LIONS_DEN_MODE: live
        run: python scripts/fetch_data.py

      - name: Guardar atualização
        run: |
          set -e
          git config user.name 'lions-den-live'
          git config user.email 'actions@github.com'
          git add data/fixtures.json data/match-details.json
          if git diff --cached --quiet; then
            echo "Sem alterações de jogos em direto."
            exit 0
          fi
          git commit -m 'dados: refresh de jogos em direto'
          git fetch origin main
          if ! git rebase origin/main; then
            git checkout --theirs -- data/fixtures.json data/match-details.json || true
            git add data/fixtures.json data/match-details.json
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
