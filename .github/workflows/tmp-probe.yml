name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          curl -sS -L -m 40 -A "$UA" "https://hp.fpp.pt/Competicao/493" -o c.html -w "%{http_code} %{size_download}\n"
          python3 - <<'PY'
          import re,html
          s=open('c.html',encoding='utf-8',errors='ignore').read()
          print(re.findall(r'<title>(.*?)</title>',s,re.S)[:1])
          t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S)
          txt=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',t)))
          i=txt.find('Sporting'); print('TEXT:',txt[:600]); print('SP:',txt[max(0,i-800):i+1200])
          print('tables',len(re.findall(r'<table',s)))
          print('links',sorted(set(re.findall(r'href="(/[^"]+)"',s)))[:60])
          print('api',sorted(set(re.findall(r'["\'](/api/[^"\']+|https?://[^"\']*api[^"\']*)["\']',s)))[:20])
          PY
