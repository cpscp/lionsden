name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          g(){ curl -sS -L -m 40 -A "$UA" -H "Accept-Language: pt-PT,pt;q=0.9" "$@"; }
          g https://hp.fpp.pt/Competicao/493 -o c.html; g https://hp.fpp.pt/Classificacao/493 -o k.html; g https://hp.fpp.pt/ -o h.html
          python3 - <<'PY'
          import re
          s=open('c.html',encoding='utf-8',errors='ignore').read()
          i=s.find('/jogo/18731'); print('GAME HTML:', re.sub(r'\s+',' ',s[i-1500:i+900]))
          k=open('k.html',encoding='utf-8',errors='ignore').read()
          i=k.find('<table'); print('TABLE HTML:', re.sub(r'\s+',' ',k[i:i+2500]))
          h=open('h.html',encoding='utf-8',errors='ignore').read()
          print('COMPS:', re.findall(r'href="/Competicao/(\d+)"[^>]*>\s*([^<]{3,80})',h)[:40])
          PY
          for t in "sporting-cp/0MamcUoP" "sporting/002GWQdq"; do
            g "https://www.flashscore.pt/equipa/$t/resultados/" -o t.html -w "== team $t %{http_code}\n"
            python3 - <<'PY'
          import re
          s=open('t.html',encoding='utf-8',errors='ignore').read()
          feeds=re.findall(r"cjs\.initialFeeds\['([^']+)'\]\s*=\s*\{\s*data:\s*`(.*?)`",s,re.S)
          print('feeds',[(k,len(v)) for k,v in feeds])
          for k,v in feeds:
              recs=v.split('~')
              for r in recs:
                  if r.startswith('ZA÷'): print('  COMP',r[:60])
              ev=[r for r in recs if r.startswith('AA÷')]
              print('  events',len(ev)); print('  ',ev[0][:350] if ev else '')
          PY
          done
