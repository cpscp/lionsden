name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright patchright && python -m playwright install --with-deps chromium && python -m patchright install chromium && sudo apt-get install -y xvfb >/dev/null
      - run: |
          cat > p.py <<'PY'
          import sys, time
          mod = sys.argv[1]; headless = sys.argv[2] == "1"
          if mod == "patchright":
              from patchright.sync_api import sync_playwright
          else:
              from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=headless, channel="chrome" if mod=="chrome" else None)
              pg = b.new_page(locale="pt-PT")
              pg.goto("https://www.zerozero.pt/jogo/2026-11-21-sporting-uniao-da-serra/12799247", timeout=60000)
              for i in range(12):
                  t = pg.title()
                  if "moment" not in t.lower(): break
                  time.sleep(2.5)
              html = pg.content()
              print(mod, "headless" if headless else "headful", "| title:", pg.title(), "| len", len(html), "| árbitro" , "Diogo" in html)
              b.close()
          PY
          xvfb-run -a python p.py playwright 1
          xvfb-run -a python p.py playwright 0
          xvfb-run -a python p.py patchright 0
          xvfb-run -a python p.py patchright 1
          (sudo apt-get install -y google-chrome-stable >/dev/null 2>&1; xvfb-run -a python p.py chrome 0) || true
