name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          g(){ curl -sS -L -m 30 -A "$UA" "$@"; }
          txt(){ python3 -c "import sys,re,html;s=sys.stdin.read();t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S);t=re.sub(r'<[^>]+>',' ',t);t=re.sub(r'\s+',' ',html.unescape(t));print(t[:${1:-1500}])"; }
          echo "== sitemap"; g https://sporting.pt/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | head -80
          for u in https://sporting.pt/noticias https://sporting.pt/modalidades https://sporting.pt/modalidades/futsal https://sporting.pt/calendario; do echo "== $u"; g "$u" -o /tmp/p -w "%{http_code} %{size_download}\n"; txt 900 < /tmp/p; grep -oE 'href="/[^"]+"' /tmp/p | sort -u | grep -viE 'socios|loja|bilhete|museu' | head -25; grep -oE '"(https?:)?//[^"]*api[^"]*"' /tmp/p | sort -u | head -5; done
          echo "== fpp"; g https://www.fpp.pt/ -o /tmp/f; grep -oE 'href="[^"]+"' /tmp/f | grep -iE 'hoquei|calend|result|compet|jogos' | sort -u | head -25
