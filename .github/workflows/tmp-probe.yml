name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          g(){ curl -sS -L -m 40 -A "$UA" -H "Accept-Language: pt-PT,pt;q=0.9" "$@"; }
          for u in futsal/portugal/liga-placard/resultados/ futsal/portugal/liga-placard/calendario/ futsal/portugal/liga-placard/classificacao/ andebol/portugal/andebol-1/resultados/ andebol/portugal/andebol-1/classificacao/; do
            g "https://www.flashscore.pt/$u" -o p.html -w "== $u %{http_code} %{size_download}\n"
            python3 - <<'PY'
          import re
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          feeds=re.findall(r"cjs\.initialFeeds\['([^']+)'\]\s*=\s*\{\s*data:\s*`(.*?)`",s,re.S)
          print('feeds:',[(k,len(v)) for k,v in feeds])
          for k,v in feeds:
              recs=v.split('~')
              print('  feed',k,'records',len(recs))
              for r in recs[:3]: print('   ',r[:300])
              sp=[r for r in recs if 'Sporting' in r][:2]
              for r in sp: print('   SP',r[:400])
          for k in ['standings','tournamentStage','ttb','fsign','feed_sign','"tournament"']:
              i=s.find(k); 
              if i>=0: print('  ctx',k,s[max(0,i-100):i+200].replace('\n',' '))
          PY
          done
          echo "== FPP classificação"; g https://fpp.pt/hoquei-em-patins-classificacao-1a-div/ -o f.html
          python3 - <<'PY'
          import re,html
          s=open('f.html',encoding='utf-8',errors='ignore').read()
          tabs=re.findall(r'<table.*?</table>',s,re.S); print('tables',len(tabs))
          for t in tabs[:2]:
              rows=re.findall(r'<tr.*?</tr>',t,re.S)
              for r in rows[:6]: print('  ',' | '.join(html.unescape(re.sub(r'<[^>]+>','',c)).strip() for c in re.findall(r'<t[dh].*?</t[dh]>',r,re.S)))
          for m in re.findall(r'(?:src|href)="([^"]+(?:iframe|google|sheet|pdf|resultad|jornada)[^"]*)"',s)[:12]: print('  link',m)
          i=s.find('Sporting'); print('ctx', re.sub(r'<[^>]+>',' ',s[i-300:i+500]))
          PY
          echo "== FPP menu"; g https://fpp.pt/ | grep -oE 'href="https://fpp.pt/[^"]*hoquei[^"]*"' | sort -u | head -30
          echo "== FAP"; g https://portal.fpa.pt/ | grep -oE 'href="https://portal.fpa.pt/[^"]*(classifica|resultad|competi|calend)[^"]*"' | sort -u | head -20
