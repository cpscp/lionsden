name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          Q="appTypeId=5&langId=1&timezoneName=Europe/Lisbon&userCountryId=131"
          j(){ curl -sS -L -m 40 -A "$UA" "https://webws.365scores.com/web/$1"; }
          echo "== 365 date range handball"; j "games/?$Q&competitors=17697&startDate=01/09/2026&endDate=31/12/2026" | jq -c '.games|length, (.games[:30][]|{s:.startTime,c:.competitionDisplayName,h:.homeCompetitor.name,a:.awayCompetitor.name,st:.statusText,hs:.homeCompetitor.score,as:.awayCompetitor.score})' | head -30
          echo "== 365 women volley"; j "games/fixtures/?$Q&competitors=77805" | jq -c '.games[:3][]?|{s:.startTime,c:.competitionDisplayName,h:.homeCompetitor.name,a:.awayCompetitor.name}'
          echo "== sporting.pt body"; curl -sS -L -m 30 -A "$UA" https://www.sporting.pt/pt/noticias/modalidades | python3 -c "import sys,re,html;s=sys.stdin.read();print(re.findall(r'<title>(.*?)</title>',s)[:1]);t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S);t=re.sub(r'<[^>]+>',' ',t);t=re.sub(r'\s+',' ',html.unescape(t));print(t[:1500])"
          for u in "https://www.rinkhockey.net/" "https://www.fpf.pt/pt/" "https://www.flashscore.pt/equipa/sporting-cp/" "https://d.flashscore.com/x/feed/f_1_0_3_pt_1" "https://www.ligaplacard.pt" "https://www.fpp.pt/" "https://www.abola.pt/modalidades/futsal" "https://www.abola.pt/modalidades/hoquei-em-patins" "https://www.record.pt/modalidades/futsal" "https://www.record.pt/modalidades/hoquei-em-patins"; do
            curl -sS -L -m 30 -A "$UA" -H "x-fsign: SW9D1eZo" -o /tmp/p -w "%{http_code} %{size_download} $u\n" "$u"
          done
          echo "== abola futsal links"; curl -sS -L -m 30 -A "$UA" https://www.abola.pt/modalidades/futsal | grep -oE 'href="[^"]*(jogo|calendario|resultados)[^"]*"' | sort -u | head -15
          echo "== abola modalidades links"; curl -sS -L -m 30 -A "$UA" https://www.abola.pt/modalidades | grep -oE 'href="/modalidades/[a-z-]+"' | sort -u | head -30
