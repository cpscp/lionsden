name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for p in / /noticias /modalidades /eventos; do curl -sS -L -m 30 -A "$UA" "https://sporting.pt$p" -o "page$(echo $p|tr / _).html"; done
          python3 - <<'PY'
          import re,glob,collections
          for f in sorted(glob.glob('page*.html')):
              s=open(f,encoding='utf-8',errors='ignore').read()
              ev=re.findall(r'\{id:"ecal-[^}]*?\}',s)
              print('=====',f,'ecal items',len(ev))
              teams=collections.Counter(re.search(r'team:"([^"]*)"',e).group(1) for e in ev if re.search(r'team:"([^"]*)"',e))
              print(teams)
              for e in ev[:3]: print('  ',e[:500])
              keys=collections.Counter(k for e in ev for k in re.findall(r'([a-zA-Z]+):',e)); print('keys',keys)
              dates=sorted(re.findall(r'date:"([^"]+)"',''.join(ev))); print('date range',dates[:1],dates[-1:])
              sc=[e for e in ev if re.search(r'score|result|golos|homeScore',e)]; print('with score',len(sc), sc[:1])
              # news objects
              nw=re.findall(r'\{[^{}]{0,80}slug:"[^"]+"[^{}]{0,900}\}',s)
              print('news-like objs',len(nw))
              for n in nw[:3]: print('  N',n[:700])
              i=s.find('categor'); print('categor ctx', s[i-200:i+300] if i>0 else '')
          PY
