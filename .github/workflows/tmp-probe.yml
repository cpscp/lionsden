name: tmp probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" "https://www.fotmob.com/api/data/playerData?id=1320169" -o f.json
          python3 - <<'PY'
          import json
          d=json.load(open('f.json'))
          ch=d.get('careerHistory') or {}
          print('keys',list(d.keys())); print('ch keys',list(ch.keys()))
          ci=ch.get('careerItems') or {}
          print('ci keys',list(ci.keys()))
          for k,v in ci.items():
              print('==',k, list(v.keys()) if isinstance(v,dict) else type(v))
              for kk in ('teamEntries','seasonEntries'):
                  for e in (v.get(kk) or [])[:3]:
                      print('  ',kk, json.dumps(e,ensure_ascii=False)[:600])
          PY
