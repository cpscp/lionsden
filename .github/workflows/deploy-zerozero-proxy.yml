name: Deploy Zerozero proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/zerozero-proxy/**"
      - ".github/workflows/deploy-zerozero-proxy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/zerozero-proxy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/zerozero-proxy
          command: deploy
