name: tmp zerozero probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          curl -sS -L -m 40 -A "$UA" "https://www.abola.pt/futebol/equipa/sporting-16" -o eq.html -w "eq %{http_code}\n" || true
          curl -sS -L -m 40 -A "$UA" "https://www.abola.pt/futebol/competicao/112" -o comp.html -w "comp %{http_code}\n"
          grep -ohE 'https?://(www\.)?abola\.pt/futebol/jogo/[a-z0-9-]*serra[a-z0-9-]*|/futebol/jogo/[a-z0-9-]*serra[a-z0-9-]*' eq.html comp.html | sort -u | head
          U=$(grep -ohE '/futebol/jogo/sporting-[a-z0-9-]*serra-[0-9]+' eq.html comp.html | head -1); echo "U=$U"
          [ -z "$U" ] && U=$(grep -ohE '/futebol/jogo/[a-z0-9-]*serra[a-z0-9-]*-[0-9]+' eq.html comp.html | head -1)
          curl -sS -L -m 40 -A "$UA" "https://www.abola.pt$U/liveblog" -o m.html -w "match %{http_code} %{size_download}\n"
          python3 - <<'PY'
          import re,html
          s=open('m.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          for k in ['Melhor em campo','Homem do jogo','Homem do Jogo','MVP','Figura','rbitro','Posse','Remates','Cantos','Estatística','Ficha']:
              for m in list(re.finditer(k,t))[:2]:
                  print('##',k,'::',t[max(0,m.start()-150):m.start()+300])
          for k in ['mvp','manOfTheMatch','bestPlayer','referee','"stats"','statistics','possession']:
              i=s.find(k); 
              if i>=0: print('RAW',k,'::',s[max(0,i-200):i+400].replace('\n',' '))
          PY
