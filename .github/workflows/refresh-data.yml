name: Refresh central de dados

concurrency:
  group: lions-den-refresh
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
  schedule:
    # Notícias + jogos/live: de 10 em 10 minutos.
    - cron: '5,15,25,35,45,55 * * * *'
    # Futebol + estatísticas completas: de 6 em 6 horas.
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Atualizar notícias
        env:
          LIONS_DEN_MODE: news
        run: python scripts/fetch_data.py

      - name: Atualizar jogos em direto
        env:
          LIONS_DEN_MODE: live
        run: python scripts/fetch_data.py

      - name: Atualizar futebol e estatísticas
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '20 */6 * * *'
        env:
          FSAPI_KEY: ${{ secrets.FSAPI_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          LIONS_DEN_MODE: football
        run: python scripts/fetch_data.py

      - name: Guardar atualização
        run: |
          set -e
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'

          git add data/*.json

          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
            exit 0
          fi

          git commit -m 'dados: atualização automática'

          git fetch origin main
          if ! git rebase origin/main; then
            echo "Conflito durante o rebase; mantendo os dados gerados nesta execução."
            git checkout --theirs -- data/*.json || true
            git add data/*.json
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin HEAD:main
