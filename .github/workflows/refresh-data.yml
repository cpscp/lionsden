name: Refresh central de dados
# News source cleanup: Zerozero retired

concurrency:
  group: lions-den-refresh
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
  schedule:
    # Notícias + jogos/live: de 10 em 10 minutos.
    - cron: '5,15,25,35,45,55 * * * *'
    # Futebol + estatísticas completas: de 6 em 6 horas.
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Atualizar notícias
        env:
          LIONS_DEN_MODE: news
          ZEROZERO_PROXY_URL: https://lions-den-zerozero-proxy.lionsdenscp.workers.dev
        run: python scripts/fetch_data.py

      - name: Atualizar jogos em direto
        env:
          LIONS_DEN_MODE: live
        run: python scripts/fetch_data.py

      - name: Verificar jogo terminado (onzes, stats, resumo)
        id: postmatch
        run: |
          python - <<'PY'
          import json, os, time
          now = time.time()
          def load(name):
              try:
                  return json.load(open(f"data/{name}", encoding="utf-8"))
              except Exception:
                  return {}
          fixtures = load("fixtures.json").get("fixtures") or []
          details = {str(d.get("match_id")): d for d in (load("match-details.json").get("fixtures") or [])}
          videos = {str(v.get("match_id")) for v in (load("match-videos.json").get("videos") or [])}
          minute = time.gmtime().tm_min
          need, why = False, ""
          for f in fixtures:
              age = now - float(f.get("date") or 0)
              fid = str(f.get("id"))
              if not (100 * 60 <= age <= 48 * 3600):
                  continue
              d = details.get(fid) or {}
              lineups = (d.get("lineups") or {}).get("home") or {}
              finished = str((f.get("status") or {}).get("short", "")).lower() == "finished"
              if age <= 12 * 3600 and (not finished or not lineups.get("players") or not d.get("statistics")):
                  need, why = True, f"{fid}: resultado/detalhes em falta"
              elif fid not in videos and minute % 30 < 10:
                  need, why = True, f"{fid}: resumo em vídeo em falta"
          print("Pós-jogo:", why or "nada pendente")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"football={'true' if need else 'false'}\n")
          PY

      - name: Atualizar futebol e estatísticas
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '20 */6 * * *' || steps.postmatch.outputs.football == 'true'
        env:
          FSAPI_KEY: ${{ secrets.FSAPI_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          LIONS_DEN_MODE: football
        run: python scripts/fetch_data.py

      - name: Guardar atualização
        run: |
          set -e
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'

          git add data/*.json

          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
            exit 0
          fi

          git commit -m 'dados: atualização automática'

          git fetch origin main
          if ! git rebase origin/main; then
            echo "Conflito durante o rebase; mantendo os dados gerados nesta execução."
            git checkout --theirs -- data/*.json || true
            git add data/*.json
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin HEAD:main
