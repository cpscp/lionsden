# Deploy Lion's Den to Firebase Hosting on pushes to main
name: Deploy to Firebase Hosting on main

on:
  # Deploy normal source/frontend changes pushed by a human or regular Git client.
  # Data-only commits created by GitHub Actions use GITHUB_TOKEN and do not emit
  # a new push-triggered workflow, so those are handled by workflow_run below.
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'

  # Deploy after the automated data pipelines finish successfully.
  workflow_run:
    workflows:
      - Refresh central de dados
      - Atualizar notícias
      - Atualizar futebol e estatísticas
      - Atualizar H2H
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# Only one deploy at a time; a newer data commit supersedes a queued deploy.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every data refresh creates a new Hosting version, and Firebase keeps them
      # all by default, which fills the free (Spark) storage quota and makes
      # deploys fail with HTTP 429. Keep only the latest releases and delete the
      # older versions before each deploy, so the site can update as often as needed.
      - name: Authenticate to Google Cloud
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIONSDENSCP }}

      - name: Prune old Hosting versions
        continue-on-error: true
        if: steps.gauth.outcome == 'success'
        env:
          SITE: lionsdenscp
          KEEP: '5'
        run: |
          set -u
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebasehosting.googleapis.com/v1beta1/sites/$SITE"
          AUTH="Authorization: Bearer $TOKEN"

          echo "Setting live channel retention to $KEEP releases"
          curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/channels/live?updateMask=retainedReleaseCount" \
            -d "{\"retainedReleaseCount\": $KEEP}" | jq -c '{name, retainedReleaseCount, error}'

          : > versions.tsv
          PAGE=""
          while :; do
            RESP=$(curl -sS -H "$AUTH" "$API/versions?pageSize=100${PAGE:+&pageToken=$PAGE}")
            echo "$RESP" | jq -r '.versions[]? | select(.status=="FINALIZED") | [.createTime, .name] | @tsv' >> versions.tsv
            PAGE=$(echo "$RESP" | jq -r '.nextPageToken // empty')
            [ -z "$PAGE" ] && break
          done

          TOTAL=$(wc -l < versions.tsv)
          sort -r versions.tsv | tail -n +$((KEEP + 1)) | cut -f2 > to_delete.txt
          echo "Finalized versions: $TOTAL, deleting: $(wc -l < to_delete.txt)"
          xargs -P 8 -I{} curl -sS -o /dev/null -w '%{http_code} {}\n' -X DELETE -H "$AUTH" \
            "https://firebasehosting.googleapis.com/v1beta1/{}" < to_delete.txt | awk '{print $1}' | sort | uniq -c

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIONSDENSCP }}
          projectId: lionsdenscp
          channelId: live
          # firebase-tools 15.34.1 (2026-10-21) added a mandatory Service Usage
          # check that this service account is not allowed to perform. Keep the
          # pin until the account has roles/serviceusage.serviceUsageConsumer.
          firebaseToolsVersion: 15.34.0
