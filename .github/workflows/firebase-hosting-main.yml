# Deploy Lion's Den to Firebase Hosting on pushes to main
name: Deploy to Firebase Hosting on main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIONSDENSCP }}
          projectId: lionsdenscp
          channelId: live
