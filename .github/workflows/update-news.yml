name: Atualizar notícias

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Atualizar notícias
        env:
          LIONS_DEN_MODE: news
        run: python scripts/fetch_data.py
      - name: Commitar notícias
        run: |
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'
          git add data/news.json data/status.json
          git diff --cached --quiet || git commit -m 'noticias: atualização automática'
          git push
