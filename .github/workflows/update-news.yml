name: Atualizar notícias

concurrency:
  group: lions-den-data
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_data.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Atualizar notícias
        env:
          LIONS_DEN_MODE: news
        run: python scripts/fetch_data.py
      - name: Commitar notícias
        run: |
          set -e
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'
          git add data/news.json data/status.json
          if git diff --cached --quiet; then
            echo "Sem alterações nas notícias."
            exit 0
          fi
          git commit -m 'noticias: atualização automática'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
