name: Atualizar notícias

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_data.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Atualizar notícias
        env:
          LIONS_DEN_MODE: news
        run: python scripts/fetch_data.py
      - name: Commitar notícias
        run: |
          set -e

          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'
          git add data/news.json data/status.json

          if git diff --cached --quiet; then
            echo "Sem alterações nas notícias."
            exit 0
          fi

          git commit -m 'noticias: atualização automática'

          git fetch origin main

          if ! git rebase origin/main; then
            echo "Conflito durante o rebase; mantendo os JSON de notícias desta execução."
            git checkout --theirs -- data/news.json data/status.json || true
            git add data/news.json data/status.json
            GIT_EDITOR=true git rebase --continue
          fi

          if ! git push origin HEAD:main; then
            echo "O remoto mudou durante o push. A sincronizar e tentar novamente..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Conflito no segundo rebase; mantendo os JSON de notícias."
              git checkout --theirs -- data/news.json data/status.json || true
              git add data/news.json data/status.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi
