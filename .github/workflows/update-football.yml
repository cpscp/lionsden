name: Atualizar futebol e estatísticas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Atualizar futebol
        env:
          FSAPI_KEY: ${{ secrets.FSAPI_KEY }}
          LIONS_DEN_MODE: football
        run: python scripts/fetch_data.py
      - name: Commitar dados
        run: |
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'
          git add data/*.json
          git diff --cached --quiet || git commit -m 'dados: atualização futebol'
          git push
