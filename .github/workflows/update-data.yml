name: Atualizar dados do Sporting

on:
  schedule:
    # A cada 30 minutos. GitHub não garante o minuto exato (pode atrasar
    # em picos de utilização), e o mínimo suportado é de 5 em 5 minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite correr manualmente no separador "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Ir buscar dados
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Fazer commit se houver alterações
        run: |
          git config user.name "lions-den-bot"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "dados: atualização automática"
          git push
