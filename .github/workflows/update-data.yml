name: Atualizar dados do Sporting

on:
  schedule:
    # Core schedule/news every 30 minutes. A full refresh is done separately.
    - cron: '*/30 * * * *'
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de atualização'
        required: true
        default: full
        type: choice
        options:
          - full
          - core

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Atualizar dados
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIONS_DEN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 */6 * * *' && 'full' || 'core') }}
        run: python scripts/fetch_data.py
      - name: Commitar alterações
        run: |
          git config user.name 'lions-den-bot'
          git config user.email 'actions@github.com'
          git add data/*.json
          git diff --cached --quiet || git commit -m 'dados: atualização automática'
          git push
